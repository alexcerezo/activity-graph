name: Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action generates the SVGs, injects the demo graph into this
      # README (first marker pair only) and commits the changes itself.
      # Uses @main to dogfood the latest version before releasing.
      - uses: alexcerezo/activity-graph@main
